name: estoque_app
description: App de contagem de estoque com leitura de código de barras.
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  mobile_scanner: ^5.2.3
  file_picker: ^8.1.2
  path_provider: ^2.1.3
  csv: ^6.0.0
  permission_handler: ^11.3.1
  share_plus: ^10.0.0
  intl: ^0.19.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/
